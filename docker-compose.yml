services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    # Inside the app container, `localhost` is not the database - use the compose service name `db`.
    # This overrides DATABASE_URL from .env so Docker deployments work with the bundled database.
    environment:
      DATABASE_URL: mysql://panel:panel_password@db:3306/dipencil_panel
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: dipencil_panel
      MARIADB_USER: panel
      MARIADB_PASSWORD: panel_password
      MARIADB_ROOT_PASSWORD: panel_root_password
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--connect",
          "--innodb_initialized",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mariadb_data:
